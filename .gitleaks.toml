title = "project gitleaks config"

[extend]
useDefault = true # Uses the standard built-in gitleaks config as a base.

[[allowlists]]
description = "System password permission UUIDs"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^src/datasets/system/access-control/role-permission-assignment\.dataset\.ts$''']
regexTarget = "match"
regexes = ['''^(?:REAUTHENTICATION_CONFIRM_PASSWORD|PASSWORD_CHANGE)\s*=\s*"[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}"$''']

[[allowlists]]
description = "Demo leave operation identifiers"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^src/datasets/demo/hr/(hr-request|leave-ledger-entry)\.dataset\.ts$''']
regexTarget = "secret"
regexes = ['''^(?:(?:reserve|consume)/)?leave/(?:nimbus/E[0-9]{3}|orbit/[XF][0-9]{3})$''']

# Global allowlist — applies to ALL rules, except those
# explicitly scoped via targetRules in [[allowlists]].
[[allowlists]]
description = "global allowlist"

regexTarget = "match"

regexes = [
  '''219-09-9999''',
  '''078-05-1120''',
  '''(9[0-9]{2}|666)-\d{2}-\d{4}''',
]

paths = [
  '''gitleaks\.toml''',
  '''(.*?)(jpg|jpeg|png|gif|pdf|docx?|xlsx?|pptx?|bin|svg|socket)$''',
]

stopwords = [
  '''client''',
  '''endpoint''',
]
