syntax = "proto3";

package monadiam.kafka.reauthentication.v1;

message ReauthenticationValue {
    ReauthenticationTopicAction action_type = 1;
    ReauthenticationPayload payload = 2;
}

enum ReauthenticationTopicAction {
    GRANT = 0;
}

message ReauthenticationPayload {
    string session = 1;
    double expires_at = 2;
}
