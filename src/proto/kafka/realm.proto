syntax = "proto3";

package monadiam.kafka.realm.v1;

message RealmValue {
    RealmTopicAction action_type = 1;
    RealmPayload payload = 2;
}

enum RealmTopicAction {
    REVOKE = 0;
    RESTORE = 1;
    PURGE = 2;
}

message RealmPayload {
    string actor = 1;
    string realm = 2;
    RealmInput input = 3;
}

message RealmInput {
    double version = 1;
}
