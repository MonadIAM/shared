syntax = "proto3";

package monadiam.grpc.access_control.v1;

service AccessControlService {
    rpc ListEffectivePrivileges(ListEffectivePrivilegesRequest)
        returns (ListEffectivePrivilegesResponse);
}

message ListEffectivePrivilegesRequest {
    string account = 1;
    string realm = 2;
}

enum PrivilegeScope {
    GLOBAL = 0;
    REALM = 1;
}

message ListEffectivePrivilegesResponse {
    map<string, PrivilegeScope> privileges = 1;
    map<string, PrivilegeScope> global = 2;
    map<string, string> revision = 3;
    map<string, string> global_revision = 4;
    bool revisioned = 5;
}
